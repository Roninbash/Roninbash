<svg xmlns="http://www.w3.org/2000/svg" width="900" height="220" viewBox="0 0 900 220" role="img" aria-label="Joel Raj — healthcare and AI software">
  <defs>
    <clipPath id="reveal"><rect x="0" y="0" width="0" height="220"><animate attributeName="width" from="0" to="900" dur="2.6s" begin="0.4s" fill="freeze" calcMode="spline" keySplines="0.2 0 0.2 1"/></rect></clipPath>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#e8dcc6" stop-opacity=".16"/><stop offset="1" stop-color="#e8dcc6" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="900" height="220" rx="14" fill="#161615"/>
  <g fill="#e8dcc6">
    <circle cx="120" cy="40" r="1.2"><animate attributeName="opacity" values=".3;1;.3" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="310" cy="178" r="1"><animate attributeName="opacity" values="1;.3;1" dur="5s" repeatCount="indefinite"/></circle>
    <circle cx="520" cy="28" r="1.4"><animate attributeName="opacity" values=".4;1;.4" dur="6s" repeatCount="indefinite"/></circle>
    <circle cx="690" cy="150" r="1"><animate attributeName="opacity" values="1;.2;1" dur="3.5s" repeatCount="indefinite"/></circle>
    <circle cx="820" cy="60" r="1.3"><animate attributeName="opacity" values=".3;1;.3" dur="7s" repeatCount="indefinite"/></circle>
    <circle cx="420" cy="96" r=".9"><animate attributeName="opacity" values=".5;1;.5" dur="4.5s" repeatCount="indefinite"/></circle>
  </g>
  <circle cx="790" cy="110" r="90" fill="url(#glow)"/>
  <g transform="translate(790 110)">
    <path d="M-10 -40A40 40 0 1 0 -10 40A22 40 0 0 1 -10 -40Z" fill="#e8dcc6" stroke="#f6f2eb" stroke-width="1"/>
    <animateTransform attributeName="transform" type="rotate" values="-6;6;-6" dur="14s" repeatCount="indefinite" additive="sum"/>
  </g>
  <g clip-path="url(#reveal)" font-family="Georgia, 'Times New Roman', serif" fill="#f1ebe1">
    <text x="56" y="92" font-size="44" font-style="italic" letter-spacing="-1">Joel Raj</text>
    <text x="56" y="130" font-size="19" fill="#bfb4a3">software for clinics, labs and the people who read their reports</text>
    <text x="56" y="172" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#cfae85">node · postgres · swift · kotlin · python · rag</text>
  </g>
  <rect x="56" y="156" width="2" height="20" fill="#cfae85"><animate attributeName="x" from="56" to="470" dur="2.2s" begin="0.8s" fill="freeze"/><animate attributeName="opacity" values="1;0;1" dur="1s" begin="3s" repeatCount="indefinite"/></rect>
</svg>
